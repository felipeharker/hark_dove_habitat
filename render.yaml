# Render Blueprint for Dove Habitat: one static service, published as it is
# from this repository's main branch.
#
# It records the dashboard settings. Render reads this file only if it is
# synced as a Blueprint; until then the dashboard rules, and the two must
# match.
services:
  - type: web
    name: hark-dove-habitat
    runtime: static
    repo: https://github.com/felipeharker/hark_dove_habitat
    branch: main
    buildCommand: echo "No build step - site/ is published as it is"
    staticPublishPath: site
    domains:
      - dove.felipeharker.org             # a Porkbun CNAME to its onrender.com address
